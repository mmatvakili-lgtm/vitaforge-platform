<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VitaForge — نسخه آزمایشی توسعه</title>
<style>
:root{--bg:#fff;--fg:#1a1d24;--mut:#5b6472;--pri:#0b5fff;--bd:#d9dde5;--warn:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--fg:#e8ebf1;--mut:#9aa4b2;--pri:#6ea0ff;--bd:#2b3240;--warn:#3a3218}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,Tahoma,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
.warn{background:var(--warn);padding:8px 12px;border-radius:8px}
section{border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:12px 0}
input,select,button{font:inherit;padding:8px 10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:transparent;color:inherit;min-height:44px}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;padding-inline:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
pre{direction:ltr;text-align:left;overflow:auto;background:transparent;border:1px solid var(--bd);padding:8px;border-radius:8px}
</style></head>
<body><main>
<h1>VitaForge</h1>
<p class="warn" role="note">نسخه آزمایشی توسعه: داده‌ها موقت و حرکات نمونه‌اند؛ محتوای بالینی بازبینی نشده است. توصیه پزشکی نیست.</p>
<section aria-labelledby="h1"><h2 id="h1">۱. ورود / ثبت‌نام</h2>
<label>ایمیل <input id="email" type="email" autocomplete="email" value="demo@example.com"></label><br>
<label>گذرواژه <input id="pw" type="password" autocomplete="current-password" value="Str0ngPassw0rd"></label><br>
<button id="reg">ثبت‌نام و ورود</button></section>
<section aria-labelledby="h2"><h2 id="h2">۲. آشناسازی و غربالگری</h2>
<label>سن <input id="age" type="number" value="30" min="1" max="119"></label>
<label>هدف <select id="goal"><option value="strength">قدرت</option><option value="muscle_gain">حجم</option><option value="general_fitness">تناسب عمومی</option><option value="fat_loss">کاهش چربی</option></select></label>
<label>روز در هفته <input id="days" type="number" value="3" min="1" max="6"></label>
<label>دقیقه هر جلسه <input id="mins" type="number" value="60" min="20" max="180"></label>
<label><input id="consent" type="checkbox" checked> رضایت پردازش داده سلامت را می‌دهم</label>
<fieldset><legend>غربالگری علائم هشدار</legend>
<label><input type="checkbox" class="rf" data-q="chest_pain"> درد قفسه سینه</label><br>
<label><input type="checkbox" class="rf" data-q="fainting"> غش</label><br>
<label><input type="checkbox" class="rf" data-q="severe_unexplained_pain"> درد شدید بی‌دلیل</label><br>
<label><input type="checkbox" class="rf" data-q="neurological_symptoms"> علائم عصبی</label></fieldset>
<button id="gen">ساخت برنامه</button></section>
<section aria-live="polite"><h2>نتیجه</h2><div id="out">—</div><pre id="raw"></pre></section>
</main>
<script>
// Cookie session (HttpOnly sessionid) + CSRF double-submit header, as DOC-07 requires. No token is ever readable by script.
let loggedIn=false;const $=id=>document.getElementById(id);
const csrf=()=>(document.cookie.split("; ").find(c=>c.startsWith("csrftoken="))||"").slice(10);
async function api(m,p,b){const h={"Content-Type":"application/json"};if(m!=="GET")h["X-CSRFToken"]=csrf();
const r=await fetch("/api/v1"+p,{method:m,headers:h,credentials:"same-origin",body:m==="GET"?undefined:JSON.stringify(b||{})});
let j=null;try{j=await r.json()}catch(e){}return{st:r.status,j}}
function show(nodes){const o=$("out");o.replaceChildren(...nodes)}
function el(t,txt){const e=document.createElement(t);e.textContent=txt;return e}
$("reg").onclick=async()=>{const dob=new Date();dob.setFullYear(dob.getFullYear()-30);
await api("POST","/auth/register",{email:$("email").value,password:$("pw").value,date_of_birth:dob.toISOString().slice(0,10),language:"fa"});
const em=$("email").value;const cm=await api("GET","/dev/captured-mail?kind=verification&to="+encodeURIComponent(em));   /* dev capture adapter: nothing was e-mailed */
if(cm.st===200)await api("POST","/auth/verify",{identifier:em,code:cm.j.secret});
const r=await api("POST","/auth/login",{identifier:$("email").value,password:$("pw").value});
loggedIn=r.st===200;show([el("p",loggedIn?"وارد شدید.":"ورود ناموفق ("+r.st+")")])};
$("gen").onclick=async()=>{if(!loggedIn){show([el("p","ابتدا وارد شوید.")]);return}
const steps=[{answers:{age:+$("age").value}},{answers:{goal:$("goal").value,level:"beginner"}},{answers:{days_per_week:+$("days").value,session_minutes:+$("mins").value}},{answers:{equipment:[]}}];
for(let i=0;i<steps.length;i++){const r=await api("PUT","/onboarding/steps/"+(i+1),steps[i]);if(r.st!==200){show([el("p","خطا در مرحله "+(i+1)+" ("+r.st+")")]);return}}
const trace=[];
if($("consent").checked){const d=await api("GET","/consents/documents");const doc=(d.j||[]).find(x=>x.type==="health_data");
if(!doc){show([el("p","سند رضایت پیدا نشد ("+d.st+")")]);return}
const cr=await api("POST","/consents",{document_id:doc.id,granted:true});trace.push("consent:"+cr.st);
if(cr.st!==201&&cr.st!==200){show([el("p","ثبت رضایت ناموفق ("+cr.st+")")]);return}}
const a={};document.querySelectorAll(".rf").forEach(c=>a[c.dataset.q]=c.checked);
const sr=await api("POST","/health/screening",{screening_version:1,answers:a});trace.push("screening:"+sr.st);
if(sr.st!==200){$("raw").textContent=JSON.stringify(sr.j,null,1);show([el("p","ثبت غربالگری ناموفق ("+sr.st+")")]);return}
const c=await api("POST","/onboarding/complete",{});if(c.st!==200){show([el("p","برای ادامه رضایت لازم است.")]);return}
const r=await api("POST","/workouts/generate",{});$("raw").textContent=trace.join(" ")+" screening_sent="+JSON.stringify(a)+"\n"+JSON.stringify(r.j,null,1);
if(r.st===422){show([el("p","حرکت بازبینی‌شده کافی برای تجهیزات و محدودیت‌های شما وجود ندارد.")]);return}
if(r.st!==200){show([el("p","خطا ("+r.st+")")]);return}
if(!r.j.plan){show([el("p","برنامه ساخته نشد: ارزیابی ایمنی ("+r.j.decision.status+"). لطفاً با متخصص مشورت کنید.")]);return}
const out=[];for(const d of r.j.plan.days){out.push(el("h3",d.title));const ul=document.createElement("ul");
for(const e of d.exercises){const s=e.sets[0]||{};ul.append(el("li",e.name+" — "+e.sets.length+"×"+s.reps_min+"–"+s.reps_max))}out.push(ul)}show(out)};
</script></body></html>
