            type: string
        note:
          type: string
        targets:
          type: object
          properties:
            tdee:
              type:
              - array
              - 'null'
              items:
                type: number
            macros:
              type:
              - object
              - 'null'
              additionalProperties:
                type: array
                items:
                  type: number
            water_ml:
              type:
              - array
              - 'null'
              items:
                type: number
          additionalProperties: false
        uncertainty:
          type: string
        labels: *id001
      additionalProperties: false
      required:
      - date
      - meals
      - kcal
      - water_ml
      - targets
      - labels
      description: مقادیر وارد‌نشده تخمین زده نمی‌شوند (completeness).
    UserPrice:
      type: object
      properties:
        food_id:
          type: string
        price_per_kg:
          type: number
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        region:
          type: string
        observed_on:
          type: string
          format: date
        source:
          const: user_entered
      additionalProperties: false
      required:
      - food_id
      - price_per_kg
      - currency
      - region
      - observed_on
      - source
    UserPriceList:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/UserPrice'
      additionalProperties: false
      required:
      - prices
    UserPriceRequest:
      type: object
      properties:
        food_id:
          type: string
          maxLength: 64
        price_per_kg:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        region:
          type: string
          minLength: 2
          maxLength: 16
      additionalProperties: false
      required:
      - food_id
      - price_per_kg
      - currency
      - region
      description: قیمت فقط از ورودی کاربر؛ مانند هر قیمت دیگر پس از ۴۵ روز کنار گذاشته می‌شود.
    ShoppingState:
      type: object
      properties:
        checked:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 300
          uniqueItems: true
      additionalProperties: false
      required:
      - checked
    ProgressionItem:
      type: object
      properties:
        exercise_id:
          type: string
          format: uuid
        action:
          enum:
          - increase_load
          - increase_reps
          - hold
          - reduce_load
          - suggest_deload
          - pause_pain
          - locked
          - insufficient_data
        reasons: *id001
        flags: *id001
        confidence:
          enum:
          - high
          - medium
          - low
        sessions_considered:
          type: integer
        last_load_kg:
          type: number
        last_reps:
          type: integer
        new_load_kg:
          type: number
        target_reps:
          type: integer
        factor:
          type: number
      additionalProperties: false
      required:
      - exercise_id
      - action
      - reasons
      - confidence
    ProgressionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProgressionItem'
        note:
          type: string
      additionalProperties: false
      required:
      - items
      description: پیشنهادها فقط راهنما هستند؛ Safety Core تنها مرجع تأیید حرکت/برنامه است و درد یا پرچم قفل‌شده هر پیشنهاد افزایشی را متوقف می‌کند.
