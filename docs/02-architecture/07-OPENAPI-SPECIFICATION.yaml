openapi: 3.1.0
info:
  title: AI Fitness & Health Ecosystem API
  version: 0.1.0
  description: DOC-07 — پیش‌نویس کامل برای MVP. مسیرهای Backlog در بخش x-deferred فهرست شده‌اند. هیچ endpoint پرداخت واقعی بدون Provider پیکربندی‌شده
    فعال نیست (501).
servers:
- url: /api/v1
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: نشست HttpOnly؛ برای متدهای تغییردهنده هدر X-CSRFToken الزامی است.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
      additionalProperties: false
      required:
      - code
      - message
    Message:
      type: object
      properties:
        message:
          type: string
      additionalProperties: false
      required:
      - message
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
        password:
          type: string
          minLength: 10
          maxLength: 128
        date_of_birth:
          type: string
          format: date
        language:
          enum:
          - fa
          - en
      additionalProperties: false
      required:
      - password
      - date_of_birth
    VerifyRequest:
      type: object
      properties:
        identifier:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
      additionalProperties: false
      required:
      - identifier
      - code
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
        password:
          type: string
      additionalProperties: false
      required:
      - identifier
      - password
    EmailOnlyRequest:
      type: object
      properties:
        identifier:
          type: string
      additionalProperties: false
      required:
      - identifier
    PasswordResetConfirm:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 10
      additionalProperties: false
      required:
      - token
      - new_password
    TelegramLinkRequest:
      type: object
      properties:
        identifier:
          type: string
        password:
          type: string
      additionalProperties: false
      required:
      - identifier
      - password
    TelegramLink:
      type: object
      properties:
        deep_link:
          type: string
          pattern: ^https://t\.me/
        bot_username:
          type: string
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - deep_link
      - bot_username
      - expires_at
    TelegramUpdate:
      type: object
      additionalProperties: true
      description: Telegram Update object; only private-chat /start <token> messages are acted on.
    TelegramOk:
      type: object
      properties:
        ok:
          type: boolean
      additionalProperties: false
      required:
      - ok
    TelegramStatus:
      type: object
      properties:
        linked:
          type: boolean
        notifications:
          type: boolean
      additionalProperties: false
      required:
      - linked
      - notifications
    TelegramNotificationsRequest:
      type: object
      properties:
        enabled:
          type: boolean
      additionalProperties: false
      required:
      - enabled
    SessionInfo:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        onboarding_status:
          enum:
          - not_started
          - in_progress
          - completed
      additionalProperties: false
    SessionList:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          last_seen_at:
            type: string
            format: date-time
          user_agent:
            type: string
          current:
            type: boolean
        additionalProperties: false
    Profile:
      type: object
      properties:
        display_name:
          type: string
        sex:
          enum:
          - female
          - male
          - unspecified
        country:
          type: string
        timezone:
          type: string
        language:
          enum:
          - fa
          - en
        calendar:
          enum:
          - jalali
          - gregorian
        unit_system:
          enum:
          - metric
          - imperial
        digit_style:
          enum:
          - latin
          - persian
        onboarding_status:
          type: string
      additionalProperties: false
    ProfileUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        sex:
          enum:
          - female
          - male
          - unspecified
        country:
          type: string
          minLength: 2
          maxLength: 2
        timezone:
          type: string
        language:
          enum:
          - fa
          - en
        calendar:
          enum:
          - jalali
          - gregorian
        unit_system:
          enum:
          - metric
          - imperial
        digit_style:
          enum:
          - latin
          - persian
      additionalProperties: false
    ConsentDocumentList:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          type:
            enum:
            - terms
            - health_data
            - photo
            - device
          version:
            type: integer
          locale:
            type: string
          body:
            type: string
        additionalProperties: false
    ConsentRequest:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        granted:
          type: boolean
      additionalProperties: false
      required:
      - document_id
      - granted
    Consent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        granted:
          type: boolean
        granted_at:
          type: string
          format: date-time
      additionalProperties: false
    DeleteRequest:
      type: object
      properties:
        password:
          type: string
        confirm:
          const: true
      additionalProperties: false
      required:
      - password
      - confirm
    PrivacyExport:
      type: object
      additionalProperties: true
      description: خروجی کامل داده‌های کاربر؛ بدون رمز و توکن؛ فقط برای مالک و ۲۴ ساعت.
    DataRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          enum:
          - export
          - delete
        status:
          enum:
          - requested
          - processing
          - completed
          - failed
      additionalProperties: false
    Onboarding:
      type: object
      properties:
        status:
          type: string
        current_step:
          type: integer
          minimum: 1
          maximum: 14
        answers:
          type: object
          additionalProperties: true
        summary_ready:
          type: boolean
        safety_screening_complete:
          type: boolean
      additionalProperties: false
    OnboardingStepRequest:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - answers
    MeasurementRequest:
      type: object
      properties:
        metric:
          enum:
          - height
          - weight
          - waist
          - abdomen
          - chest
          - arm
          - forearm
          - thigh
          - calf
          - body_fat_pct
          - lean_mass
        value:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
        source:
          enum:
          - measured
          - estimated
        method:
          type: string
        measured_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - metric
      - value
      - unit
      - source
    Measurement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        metric:
          type: string
        value:
          type: number
        unit:
          type: string
        source:
          type: string
        measured_at:
          type: string
          format: date-time
      additionalProperties: false
    BodyOverview:
      type: object
      properties:
        latest:
          type: object
          additionalProperties: true
        bmi:
          type: object
          properties:
            value:
              type: number
            label:
              const: screening_index
          additionalProperties: false
        whtr:
          type: object
          properties:
            value:
              type: number
            label:
              const: screening_index
          additionalProperties: false
        trend_notes:
          type: array
          items:
            type: string
      additionalProperties: false
    AssessmentRequest:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: false
          properties:
            squat_reps:
              type: integer
              minimum: 0
              maximum: 100
            squat_heels_down:
              type: boolean
            squat_knees_cave:
              type: boolean
            hinge_reach:
              enum:
              - above_knee
              - shin
              - toes
              - palms_floor
            glute_bridge_s:
              type: integer
              minimum: 0
              maximum: 180
            push_variant:
              enum:
              - wall
              - incline
              - knee
              - standard
            push_reps:
              type: integer
              minimum: 0
              maximum: 100
            pull_variant:
              enum:
              - none
              - inverted_row
              - band_assisted
              - pullup
            pull_reps:
              type: integer
              minimum: 0
              maximum: 50
            plank_s:
              type: integer
              minimum: 0
              maximum: 300
            side_plank_left_s:
              type: integer
              minimum: 0
              maximum: 180
            side_plank_right_s:
              type: integer
              minimum: 0
              maximum: 180
            balance_left_s:
              type: integer
              minimum: 0
              maximum: 60
            balance_right_s:
              type: integer
              minimum: 0
              maximum: 60
            overhead_reach:
              enum:
              - 'no'
              - partial
              - 'yes'
            ankle_knee_to_wall_cm:
              type: integer
              minimum: 0
              maximum: 20
            cardio_minutes:
              type: integer
              minimum: 0
              maximum: 60
            pain_regions:
              type: array
              items:
                type: string
              maxItems: 20
      additionalProperties: false
      required:
      - answers
    AssessmentDomain:
      type: object
      properties:
        score:
          type:
          - integer
          - 'null'
        band:
          type:
          - string
          - 'null'
        level:
          type:
          - string
          - 'null'
        tested:
          type: boolean
        caution:
          type: boolean
      additionalProperties: false
    AssessmentProfile:
      type: object
      properties:
        method:
          type: string
        content_status:
          const: ai_curated
        answers:
          type: object
          additionalProperties: true
        domains:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AssessmentDomain'
        overall_level:
          type:
          - string
          - 'null'
        tested_count:
          type: integer
        strengths:
          type: array
          items:
            type: object
            additionalProperties: true
        weaknesses:
          type: array
          items:
            type: object
            additionalProperties: true
        flags:
          type: array
          items:
            type: object
            additionalProperties: true
        limiters:
          type: array
          items:
            type: string
        priorities:
          type: object
          additionalProperties:
            type: number
        corrective_focus:
          type: array
          items:
            type: string
        pain_reported:
          type: boolean
        pain_regions:
          type: array
          items:
            type: string
        untested:
          type: array
          items:
            type: string
      additionalProperties: false
    AssessmentResult:
      type: object
      properties:
        profile:
          oneOf:
          - $ref: '#/components/schemas/AssessmentProfile'
          - type: 'null'
        assessed_at:
          type:
          - string
          - 'null'
        history_count:
          type: integer
      additionalProperties: false
    HealthProfile:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        out_of_scope:
          type: array
          items:
            type: string
        latest_decision:
          $ref: '#/components/schemas/SafetyDecision'
      additionalProperties: false
    ConditionRequest:
      type: object
      properties:
        region:
          type: string
        side:
          enum:
          - left
          - right
          - both
          - na
        problem_type:
          enum:
          - pain
          - limited_motion
          - diagnosed_injury
          - surgery_history
          - other
        onset_date:
          type: string
          format: date
        trend:
          enum:
          - better
          - same
          - worse
          - unknown
        self_severity:
          type: integer
          minimum: 0
          maximum: 10
        aggravating_factors:
          type: string
        relieving_factors:
          type: string
      additionalProperties: false
      required:
      - region
      - problem_type
      description: خوداظهاری؛ فیلدهای تشخیص/محدودیت متخصص پذیرفته نمی‌شوند (mass-assignment محافظت‌شده).
    ConditionUpdate:
      type: object
      properties:
        trend:
          type: string
        self_severity:
          type: integer
          minimum: 0
          maximum: 10
        aggravating_factors:
          type: string
        relieving_factors:
          type: string
      additionalProperties: false
    Condition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        region:
          type: string
        side:
          type: string
        problem_type:
          type: string
        status:
          type: string
        source:
          enum:
          - self_reported
          - professional
        trend:
          type: string
        self_severity:
          type: integer
      additionalProperties: false
    SymptomRequest:
      type: object
      properties:
        context:
          enum:
          - screening
          - before_session
          - during_session
          - after_session
          - checkin
        region:
          type: string
        severity:
          type: integer
          minimum: 0
          maximum: 10
        note:
          type: string
          maxLength: 500
      additionalProperties: false
      required:
      - context
      - region
    Symptom:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recorded_at:
          type: string
          format: date-time
      additionalProperties: false
    PainLogRequest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        region:
          type: string
        side:
          type: string
        intensity:
          type: integer
          minimum: 0
          maximum: 10
        timing:
          enum:
          - before
          - during
          - after
          - general
      additionalProperties: false
      required:
      - region
      - intensity
      - timing
    PainLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        decision:
          $ref: '#/components/schemas/SafetyDecision'
      additionalProperties: false
    ScreeningRequest:
      type: object
      properties:
        screening_version:
          type: integer
        answers:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - screening_version
      - answers
    OutOfScopeRequest:
      type: object
      properties:
        flag_type:
          enum:
          - pregnancy
          - high_risk_condition
          - other
      additionalProperties: false
      required:
      - flag_type
    SafetyDecision:
      type: object
      properties:
        decision_id:
          type: string
          format: uuid
        status:
          enum:
          - ALLOW
          - ALLOW_WITH_MODIFICATION
          - RESTRICT
          - NEEDS_INFO
          - STOP_AND_REFER
          - BLOCK_OUT_OF_SCOPE
          - BLOCK_CONSENT
          - ERROR_FAILSAFE
        reasons:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message_key:
                type: string
            additionalProperties: false
        required_questions:
          type: array
          items:
            type: string
        referral:
          type: object
          properties:
            urgency:
              enum:
              - urgent
              - non_urgent
            message_key:
              type: string
            content_status:
              enum:
              - draft_unreviewed
              - clinical_reviewed
              - published
          additionalProperties: false
        rule_set_version:
          type: integer
        evaluated_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - decision_id
      - status
    ExerciseList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseSummary'
      additionalProperties: false
    ExerciseSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        name_en:
          type: string
        difficulty:
          type: string
        muscles:
          type: array
          items:
            type: string
        equipment:
          type: array
          items:
            type: string
        has_media:
          type: boolean
        review_status:
          type: string
        movement_pattern:
          type: string
      additionalProperties: false
    ExerciseDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        name_en:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            type: string
        breathing:
          type: string
        common_mistakes:
          type: array
          items:
            type: string
        safety_notes:
          type: string
        compatibility:
          type: object
          properties:
            status:
              enum:
              - allowed
              - caution
              - blocked
              - unknown
            reasons:
              type: array
              items:
                type: string
          additionalProperties: false
        media:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              url:
                type: string
            additionalProperties: false
        review_status:
          type: string
      additionalProperties: false
    AlternativesResult:
      type: object
      properties:
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseSummary'
        none_valid:
          type: boolean
        decision:
          $ref: '#/components/schemas/SafetyDecision'
      additionalProperties: false
    GenerateRequest:
      type: object
      properties:
        preferred_structure:
          enum:
          - auto
          - full_body
          - upper_lower
          - push_pull_legs
          - hybrid
        regenerate_reason:
          type: string
      additionalProperties: false
    GenerateResponse:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/SafetyDecision'
        plan:
          oneOf:
          - $ref: '#/components/schemas/WorkoutPlan'
          - type: 'null'
      additionalProperties: false
      required:
      - decision
      description: plan فقط وقتی decision.status ∈ {ALLOW, ALLOW_WITH_MODIFICATION}
    WorkoutPlan:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        version_no:
          type: integer
        structure:
          type: string
        goal:
          type: string
        confidence:
          enum:
          - high
          - medium
          - low
        rationale:
          type: object
          additionalProperties: true
        safety_decision_id:
          type: string
          format: uuid
        days:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutDay'
      additionalProperties: false
      required:
      - plan_id
      - version_no
      - safety_decision_id
    WorkoutDay:
      type: object
      properties:
        day_id:
          type: string
          format: uuid
        day_index:
          type: integer
        title:
          type: string
        est_minutes:
          type: integer
        exercises:
          type: array
          items:
            type: object
            properties:
              workout_exercise_id:
                type: string
                format: uuid
              exercise_id:
                type: string
                format: uuid
              name:
                type: string
              role:
                enum:
                - warmup
                - main
                - accessory
                - cooldown
              sets:
                type: array
                items:
                  type: object
                  properties:
                    set_no:
                      type: integer
                    reps_min:
                      type: integer
                    reps_max:
                      type: integer
                    duration_sec:
                      type: integer
                    target_rpe:
                      type: number
                    rest_sec:
                      type: integer
                  additionalProperties: false
              stop_criteria_key:
                type: string
            additionalProperties: false
      additionalProperties: false
    PlanVersionList:
      type: array
      items:
        type: object
        properties:
          version_no:
            type: integer
          created_at:
            type: string
            format: date-time
          safety_decision_id:
            type: string
            format: uuid
        additionalProperties: false
    SubstituteRequest:
      type: object
      properties:
        workout_exercise_id:
          type: string
          format: uuid
        reason:
          enum:
          - pain
          - equipment
          - preference
          - other
      additionalProperties: false
      required:
      - workout_exercise_id
      - reason
    SessionStartRequest:
      type: object
      properties:
        day_id:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - day_id
    WorkoutSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        started_at:
          type: string
          format: date-time
        day_title:
          type: string
        sets_done:
          type: integer
        volume_kg:
          type: number
        duration_min:
          type: integer
        perceived_difficulty:
          type: integer
        aborted_reason:
          type: string
        logged_sets:
          type: array
          items:
            type: object
            properties:
              exercise_id:
                type: string
                format: uuid
              set_no:
                type: integer
              reps:
                type: integer
              load_kg:
                type: number
              skipped:
                type: boolean
              personal_record:
                type: boolean
            additionalProperties: false
      additionalProperties: false
    SetLogRequest:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
        exercise_id:
          type: string
          format: uuid
        set_no:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 0
        load_kg:
          type: number
          minimum: 0
        duration_sec:
          type: integer
          minimum: 0
        rpe:
          type: number
          minimum: 1
          maximum: 10
        rir:
          type: integer
          minimum: 0
          maximum: 10
        rest_sec:
          type: integer
          minimum: 0
        skipped:
          type: boolean
        skipped_reason:
          type: string
        substituted_exercise_id:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - client_uuid
      - exercise_id
      - set_no
    SetLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_uuid:
          type: string
          format: uuid
        personal_record:
          type: boolean
      additionalProperties: false
    SessionFinishRequest:
      type: object
      properties:
        perceived_difficulty:
          type: integer
          minimum: 1
          maximum: 10
        aborted_reason:
          enum:
          - pain
          - fatigue
          - time
          - other
        pain_region:
          enum:
          - neck
          - shoulder
          - elbow
          - wrist_hand
          - upper_back
          - lower_back
          - hip
          - knee
          - ankle_foot
          - chest
          - other
        notes:
          type: string
          maxLength: 1000
      additionalProperties: false
    PainFollowup:
      type: object
      properties:
        referral_advised:
          type: boolean
        region:
          type:
          - string
          - 'null'
        message_key:
          enum:
          - pain_stop_generic
          - pain_stop_region
          - pain_stop_chest
        plan_paused:
          type: boolean
      additionalProperties: false
      required:
      - referral_advised
      - message_key
