name: ci
on: [push, pull_request]
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-light.txt
      - run: cd backend && python -m pytest -q
      - run: python tools/lint_docs.py
  django-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vitaforge, POSTGRES_PASSWORD: vitaforge, POSTGRES_DB: vitaforge_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vitaforge" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - env:
          VITAFORGE_TEST_STORE: django
          VITAFORGE_TEST_DATABASE_URL: postgres://vitaforge:vitaforge@localhost:5432/vitaforge_test
        run: cd backend && python manage.py makemigrations --check --dry-run && python -m pytest -q
