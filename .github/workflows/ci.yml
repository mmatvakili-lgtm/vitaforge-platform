name: ci
# Runs on every push to any branch and on pull requests. Production deployment must only ever come from `main` after this workflow is green
# (enable branch protection: require the jobs below, no direct pushes — see docs/OWNER_GUIDE.md).
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend (unit + contract + integration, in-memory and sqlite stores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-light.txt }
      - run: pip install -r backend/requirements-light.txt
      - run: cd backend && python -m pytest -q --ignore=e2e
      - run: cd backend && VITAFORGE_TEST_STORE=sqlite python -m pytest -q --ignore=e2e
      - name: generated artefacts are up to date (OpenAPI, frontend client)
        run: |
          python tools/gen_openapi.py && python tools/gen_frontend_api.py
          git diff --exit-code -- docs tools frontend/src/lib/api/generated.ts
      - run: python tools/normalize_docs.py && python tools/lint_docs.py
  django-postgres:
    name: django + postgres (migrations, persistence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vitaforge, POSTGRES_PASSWORD: vitaforge, POSTGRES_DB: vitaforge_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vitaforge" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - env:
          VITAFORGE_TEST_STORE: django
          VITAFORGE_TEST_DATABASE_URL: postgres://vitaforge:vitaforge@localhost:5432/vitaforge_test
        run: cd backend && python manage.py makemigrations --check --dry-run && python -m pytest -q --ignore=e2e
  frontend:
    name: frontend (typecheck, unit tests, production build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  e2e:
    name: e2e (real HTTP server + frontend client; Telegram/e-mail mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-light.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r backend/requirements-light.txt && python -m playwright install --with-deps chromium
      - run: cd backend && python -m pytest -q e2e devserver/tests/test_browser_smoke.py
  security:
    name: security (dependency audit, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: python dependencies
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --no-deps --disable-pip || pip-audit -r backend/requirements.txt
      - name: node dependencies (production, high+)
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund && npm audit --omit=dev --audit-level=high
      - name: no committed secrets (bot tokens, private keys)
        run: |
          if git grep -nIE '[0-9]{8,10}:[A-Za-z0-9_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}' -- . ':!docs' ':!*.test.ts' ':!backend/*/tests/*'; then echo "possible secret committed"; exit 1; fi
