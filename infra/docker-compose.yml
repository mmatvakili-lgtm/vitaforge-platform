# WRITTEN, NOT RUN
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: vitaforge, POSTGRES_PASSWORD: vitaforge, POSTGRES_DB: vitaforge }
  redis:
    image: redis:7
  api:
    build: { context: ../backend }
    env_file: ../.env
    depends_on: [db, redis]
    ports: ["8000:8000"]
